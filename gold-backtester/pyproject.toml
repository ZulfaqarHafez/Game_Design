[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldlab"
version = "0.1.0"
description = "TradingView-style backtester, strategy journal and auto-trader for gold (XAUUSD)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.28", "pyyaml>=6.0"]

[project.optional-dependencies]
mt5 = ["MetaTrader5; platform_system == 'Windows'"]
dev = ["pytest>=7"]

[project.scripts]
goldlab = "goldlab.__main__:main"

[tool.setuptools.packages.find]
include = ["goldlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
